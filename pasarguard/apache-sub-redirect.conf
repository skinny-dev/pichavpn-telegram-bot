# Old subscription links of the bot domain → each customer's own PasarGuard link, on the PasarGuard server.
# The map comes from `php scripts/sub_links_map.php` (copy it to /etc/apache2/picha-sub-map.txt).
# Install: see pasarguard/README.md. Anything that is not /sub/<order> goes to the bot in Telegram.
<VirtualHost *:443>
    ServerName fa-bot.theownlypwcha.top
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/fa-bot.theownlypwcha.top/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/fa-bot.theownlypwcha.top/privkey.pem
    RewriteEngine on
    RewriteMap picha_sub "txt:/etc/apache2/picha-sub-map.txt"
    # keep the query string (apps sometimes add one); 302 so a later change of the target is picked up
    RewriteCond ${picha_sub:$1|NONE} !=NONE
    RewriteRule ^/sub/([A-Za-z0-9_-]+)/?$ ${picha_sub:$1} [R=302,L,QSA,NE]
    RewriteRule ^ https://t.me/pichanet_bot [R=302,L]
</VirtualHost>
<VirtualHost *:80>
    ServerName fa-bot.theownlypwcha.top
    RewriteEngine on
    RewriteRule ^/\.well-known/acme-challenge/ - [L]
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
    DocumentRoot /var/www/html
</VirtualHost>
